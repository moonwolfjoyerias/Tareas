<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tareas MW</title>
<meta name="theme-color" content="#5E1A8A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<style>
:root{
  --morado:#5E1A8A; --morado-2:#7a3aa8; --lila:#C5ABF6; --lila-claro:#F1EAFC; --lila-hover:#E7DCFA;
  --fondo:#FAF7F3; --panel:#FFFFFF; --lateral:#F3EEE8; --texto:#2b2030; --suave:#786d80; --linea:#ECE5DE;
  --oro:#CB924F; --alta:#C2410C; --media:#C28A0E; --baja:#3F8F5A;
  --sombra:0 1px 2px rgba(43,32,48,.06),0 1px 3px rgba(43,32,48,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--fondo);color:var(--texto);font-family:Poppins,"Segoe UI",system-ui,sans-serif;font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
.oculto{display:none!important}
svg{flex:none}

/* ===== Estructura ===== */
.app{display:grid;grid-template-columns:260px 1fr;height:100dvh}
.app.con-detalle{grid-template-columns:260px 1fr 380px}

/* Lateral */
.lateral{background:var(--lateral);display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 10px 14px;border-right:1px solid var(--linea);overflow-y:auto}
.perfil{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.perfil img{width:36px;height:36px}
.perfil b{font-family:Cinzel,serif;color:var(--morado);font-size:16px;letter-spacing:.03em;display:block}
.perfil small{color:var(--suave);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.lista-menu{display:flex;flex-direction:column;gap:2px}
.item-menu{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;text-align:left;color:var(--texto)}
.item-menu:hover{background:rgba(94,26,138,.06)}
.item-menu.activo{background:var(--panel);box-shadow:var(--sombra);font-weight:500}
.item-menu svg{color:var(--morado)}
.item-menu span{flex:1}
.item-menu em{font-style:normal;font-size:12px;color:var(--suave);min-width:18px;text-align:right}
.lateral .sep{height:1px;background:var(--linea);margin:10px 8px}
.lateral .abajo{margin-top:auto}

/* Centro */
.centro{display:flex;flex-direction:column;min-width:0;height:100dvh}
.cabecera{padding:calc(18px + env(safe-area-inset-top)) 28px 10px;display:flex;align-items:flex-start;gap:12px}
.cabecera .btn-menu{display:none;margin-top:4px}
.cabecera h1{font-family:Cinzel,serif;color:var(--morado);font-size:26px;margin:0;line-height:1.2;display:flex;align-items:center;gap:10px}
.cabecera p{margin:2px 0 0;color:var(--suave);font-size:13px}
.cabecera .t{flex:1;min-width:0}
.cuerpo{flex:1;overflow-y:auto;padding:6px 28px 20px}
.cuerpo::-webkit-scrollbar{width:8px}.cuerpo::-webkit-scrollbar-thumb{background:#ddd2c8;border-radius:8px}

/* Filas de tarea (estilo To Do) */
.lista{display:flex;flex-direction:column;gap:4px;min-height:8px}
.fila{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:8px;box-shadow:var(--sombra);padding:12px 14px;cursor:pointer;user-select:none}
.fila:hover{background:#FDFBFF}
.fila.sel{background:var(--lila-claro)}
.circulo{width:20px;height:20px;border-radius:50%;border:2px solid var(--c,var(--suave));display:grid;place-items:center;flex:none;transition:background .15s}
.circulo svg{opacity:0;transition:opacity .15s}
.circulo:hover svg{opacity:.55}
.circulo:hover{background:color-mix(in srgb,var(--c,var(--morado)) 12%,transparent)}
.fila.hecha .circulo,.paso.hecho .circulo{background:var(--morado);border-color:var(--morado)}
.fila.hecha .circulo svg,.paso.hecho .circulo svg{opacity:1}
.circulo svg path{stroke:var(--c,var(--morado))}
.fila.hecha .circulo svg path,.paso.hecho .circulo svg path{stroke:#fff}
.p-alta{--c:var(--alta)}.p-media{--c:var(--media)}.p-baja{--c:var(--baja)}
.fila .txt{flex:1;min-width:0}
.fila .titulo{line-height:1.35;word-wrap:break-word}
.fila.hecha .titulo{text-decoration:line-through;color:var(--suave)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12px;color:var(--suave);margin-top:2px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .vencida{color:var(--alta)}
.meta .hoy{color:var(--morado);font-weight:500}
.bandera{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--c)}
.bandera:hover{background:var(--lila-claro)}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 8px 20px rgba(94,26,138,.25)}

.seccion{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-weight:600;font-size:13px;color:var(--texto)}
.seccion:first-child{margin-top:4px}
.seccion .punto{width:10px;height:10px;border-radius:50%;background:var(--c)}
.seccion em{font-style:normal;font-weight:400;color:var(--suave)}
.seccion.plegable{cursor:pointer}
.seccion.plegable svg{transition:transform .2s;color:var(--suave)}
.seccion.plegado svg{transform:rotate(-90deg)}
.vacio-seccion{border:1.5px dashed var(--linea);border-radius:8px;padding:12px;text-align:center;color:var(--suave);font-size:12px}
.lista:not(:empty)+.vacio-seccion{display:none}

.sugerencia{background:linear-gradient(135deg,var(--morado),var(--morado-2));color:#fff;border-radius:12px;padding:16px 18px;margin:4px 0 16px;display:flex;gap:14px;align-items:center;cursor:pointer}
.sugerencia img{width:40px;height:40px;filter:brightness(0) invert(1);opacity:.9}
.sugerencia small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--lila)}
.sugerencia b{display:block;font-size:16px;font-weight:600;margin-top:2px;line-height:1.3}
.sugerencia span{font-size:12px;opacity:.85}
.vacio{text-align:center;color:var(--suave);padding:50px 20px}
.vacio img{width:70px;opacity:.25;margin-bottom:8px}

/* Barra para agregar */
.agregar{padding:10px 28px calc(16px + env(safe-area-inset-bottom))}
.caja-agregar{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:8px;box-shadow:var(--sombra);padding:6px 6px 6px 14px;border:1.5px solid transparent}
.caja-agregar:focus-within{border-color:var(--lila)}
.caja-agregar>svg{color:var(--morado)}
.caja-agregar input{flex:1;border:0;outline:none;background:transparent;padding:9px 0;min-width:0}
.caja-agregar input::placeholder{color:var(--morado)}
.mic{width:40px;height:40px;border-radius:50%;background:var(--morado);display:grid;place-items:center;position:relative;flex:none}
.mic img{width:26px;height:26px;filter:brightness(0) invert(1)}
.mic.escuchando::before,.mic.escuchando::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--lila);animation:onda 1.5s ease-out infinite}
.mic.escuchando::after{animation-delay:.75s}
@keyframes onda{to{transform:scale(1.7);opacity:0}}
.mic.pensando{animation:latido .9s ease-in-out infinite}
@keyframes latido{50%{opacity:.55}}
.estado-voz{font-size:12px;color:var(--morado);padding:6px 4px 0;min-height:0}
.dictado-vivo{margin-top:8px;background:var(--panel);border-radius:8px;box-shadow:var(--sombra);padding:10px 12px}
.dictado-vivo textarea{width:100%;border:0;outline:none;resize:none;min-height:60px;background:transparent}
.dictado-vivo .acc{display:flex;gap:8px;justify-content:flex-end}

/* Detalle */
.detalle{background:var(--lateral);border-left:1px solid var(--linea);display:flex;flex-direction:column;height:100dvh;min-width:0}
.det-top{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 4px}
.det-cuerpo{flex:1;overflow-y:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:10px}
.tarjeta{background:var(--panel);border-radius:8px;box-shadow:var(--sombra)}
.det-titulo{display:flex;align-items:flex-start;gap:12px;padding:14px}
.det-titulo .circulo{margin-top:6px;width:22px;height:22px}
.det-titulo textarea{flex:1;border:0;outline:none;resize:none;font-size:18px;font-weight:600;line-height:1.35;background:transparent;padding:2px 0;overflow:hidden}
.det-titulo.hecha textarea{text-decoration:line-through;color:var(--suave)}
.paso{display:flex;align-items:center;gap:10px;padding:6px 14px}
.paso .circulo{width:17px;height:17px;border-width:1.8px}
.paso input{flex:1;border:0;outline:none;background:transparent;padding:6px 0;min-width:0}
.paso.hecho input{text-decoration:line-through;color:var(--suave)}
.paso .quitar{opacity:0;color:var(--suave);width:26px;height:26px;border-radius:6px;display:grid;place-items:center}
.paso:hover .quitar,.paso input:focus~.quitar{opacity:1}
.nuevo-paso{display:flex;align-items:center;gap:10px;padding:8px 14px 12px;color:var(--morado)}
.nuevo-paso input{flex:1;border:0;outline:none;background:transparent;padding:4px 0}
.nuevo-paso input::placeholder{color:var(--morado)}
.opcion{display:flex;align-items:center;gap:12px;padding:12px 14px;color:var(--suave)}
.opcion+.opcion{border-top:1px solid var(--linea)}
.opcion>svg{color:var(--morado)}
.opcion label{flex:1;color:var(--texto)}
.opcion input[type=datetime-local]{border:0;background:transparent;outline:none;color:var(--texto);flex:1;min-width:0}
.opcion .limpiar{width:26px;height:26px;border-radius:6px;display:grid;place-items:center}
.prios{display:flex;gap:6px;flex:1}
.prios button{flex:1;padding:7px 4px;border-radius:7px;border:1.5px solid var(--linea);font-size:13px;font-weight:500;color:var(--texto)}
.prios button.sel{color:#fff;border-color:var(--c);background:var(--c)}
.notas{width:100%;border:0;outline:none;resize:vertical;min-height:110px;padding:14px;background:transparent;border-radius:8px}
.original{font-size:12px;color:var(--suave);padding:10px 14px;white-space:pre-wrap}
.original b{display:block;font-weight:500;margin-bottom:2px}
.det-pie{display:flex;justify-content:space-between;align-items:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--linea);color:var(--suave);font-size:12px}
.icono{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:var(--suave)}
.icono:hover{background:rgba(94,26,138,.08);color:var(--morado)}
.icono.peligro:hover{color:var(--alta);background:#fdece5}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:8px;font-weight:500}
.btn-primario{background:var(--morado);color:#fff}
.btn-primario:disabled{opacity:.45}
.btn-suave{background:var(--lila-claro);color:var(--morado)}

/* Pantallas completas: carga, login, clave */
.pantalla{position:fixed;inset:0;background:var(--fondo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:30}
.pantalla img{width:96px}
.pantalla h1{font-family:Cinzel,serif;color:var(--morado);margin:0;font-size:26px}
.pantalla p{color:var(--suave);margin:0;max-width:340px}
.modal-fondo{position:fixed;inset:0;background:rgba(43,32,48,.35);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--panel);border-radius:12px;padding:20px;width:100%;max-width:420px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h3{margin:0 0 6px;font-family:Cinzel,serif;color:var(--morado)}
.modal p{margin:0 0 12px;color:var(--suave);font-size:13px}
.modal input{width:100%;padding:10px 12px;border:1.5px solid var(--linea);border-radius:8px;outline:none}
.modal input:focus{border-color:var(--lila)}
.modal .acc{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;background:var(--texto);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.ver{transform:translate(-50%,0);opacity:1}
.velo{display:none}

/* ===== Celular / ventana angosta ===== */
@media (max-width:899px){
  .app,.app.con-detalle{grid-template-columns:1fr}
  .lateral{position:fixed;inset:0 auto 0 0;width:280px;z-index:20;transform:translateX(-100%);transition:transform .25s}
  .lateral.abierto{box-shadow:4px 0 20px rgba(0,0,0,.12)}
  .lateral.abierto{transform:none}
  .velo{position:fixed;inset:0;background:rgba(43,32,48,.3);z-index:15}
  .velo.ver{display:block}
  .cabecera{padding-left:16px;padding-right:16px}
  .cabecera .btn-menu{display:grid}
  .cuerpo{padding:6px 12px 16px}
  .agregar{padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
  .detalle{position:fixed;inset:0;z-index:25;border-left:0}
  .paso .quitar{opacity:1}
}
@media (max-width:400px){.cabecera h1{font-size:22px}}
</style>
</head>
<body>

<!-- Carga / Login -->
<div class="pantalla" id="pCarga"><img src="isotipo.png" alt=""><p>Cargando…</p></div>
<div class="pantalla oculto" id="pLogin">
  <img src="isotipo.png" alt="">
  <h1>Tareas MW</h1>
  <p>Tu lista de pendientes, ordenada por prioridad. Escríbelas o díctalas al lobo.</p>
  <button class="btn btn-primario" id="btnLogin">Entrar con Google</button>
</div>

<div class="app oculto" id="app">
  <!-- Lateral -->
  <nav class="lateral" id="lateral">
    <div class="perfil"><img src="isotipo.png" alt=""><div><b>Tareas MW</b><small id="correo"></small></div></div>
    <div class="lista-menu">
      <button class="item-menu" data-vista="ahora"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Haz ahora</span><em id="cAhora"></em></button>
      <button class="item-menu" data-vista="prioridad"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span>Por prioridad</span><em id="cPrio"></em></button>
      <button class="item-menu" data-vista="planeado"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Planeado</span><em id="cPlan"></em></button>
      <button class="item-menu" data-vista="completadas"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg><span>Completadas</span><em id="cHechas"></em></button>
    </div>
    <div class="abajo">
      <div class="sep"></div>
      <button class="item-menu" id="btnClave"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M16 7l3 3"/></svg><span>Clave de Gemini (voz)</span></button>
      <button class="item-menu" id="btnSalir"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Cerrar sesión</span></button>
    </div>
  </nav>
  <div class="velo" id="velo"></div>

  <!-- Centro -->
  <section class="centro">
    <div class="cabecera">
      <button class="icono btn-menu" id="btnMenu" aria-label="Menú"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="t"><h1 id="titulo">Por prioridad</h1><p id="subtitulo"></p></div>
    </div>
    <div class="cuerpo" id="cuerpo"></div>
    <div class="agregar" id="zonaAgregar">
      <div class="caja-agregar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        <input id="inNueva" placeholder="Agregar una tarea" enterkeyhint="done" autocomplete="off">
        <button class="mic" id="mic" title="Dictar tarea con IA" aria-label="Dictar tarea con IA"><img src="isotipo.png" alt=""></button>
      </div>
      <div class="dictado-vivo oculto" id="dictadoVivo">
        <textarea id="dictado" placeholder="Te escucho…"></textarea>
        <div class="acc"><button class="btn" id="btnCancelarDict">Cancelar</button><button class="btn btn-primario" id="btnCrearIA">Crear con IA</button></div>
      </div>
      <div class="estado-voz" id="estadoVoz"></div>
    </div>
  </section>

  <!-- Detalle -->
  <aside class="detalle oculto" id="detalle">
    <div class="det-top">
      <button class="icono" id="btnCerrarDet" aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>
    <div class="det-cuerpo">
      <div class="tarjeta">
        <div class="det-titulo" id="dTituloBox">
          <button class="circulo" id="dCheck" aria-label="Completar"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg></button>
          <textarea id="dTitulo" rows="1"></textarea>
        </div>
        <div id="dPasos"></div>
        <div class="nuevo-paso">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <input id="inPaso" placeholder="Agregar paso" enterkeyhint="done">
        </div>
      </div>
      <div class="tarjeta">
        <div class="opcion">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
          <div class="prios" id="dPrios">
            <button data-p="alta" class="p-alta">Alta</button><button data-p="media" class="p-media">Media</button><button data-p="baja" class="p-baja">Baja</button>
          </div>
        </div>
        <div class="opcion">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <input type="datetime-local" id="dFecha" aria-label="Fecha de vencimiento">
          <button class="limpiar icono" id="dQuitarFecha" aria-label="Quitar fecha"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
      </div>
      <div class="tarjeta"><textarea class="notas" id="dNotas" placeholder="Agregar descripción o notas"></textarea></div>
      <div class="tarjeta original oculto" id="dOriginal"></div>
    </div>
    <div class="det-pie">
      <span id="dCreada"></span>
      <button class="icono peligro" id="btnBorrar" aria-label="Eliminar tarea"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
    </div>
  </aside>
</div>

<!-- Modal clave -->
<div class="modal-fondo oculto" id="mClave">
  <div class="modal">
    <h3>Clave de Gemini</h3>
    <p>Solo se usa para crear tareas por voz. Pega tu clave gratuita de Google AI Studio; queda guardada en tu cuenta privada y funciona en todos tus aparatos.</p>
    <input id="inClave" type="password" placeholder="Pega aquí tu clave" autocomplete="off">
    <div class="acc"><button class="btn" id="btnCancelarClave">Cancelar</button><button class="btn btn-primario" id="btnGuardarClave">Guardar</button></div>
  </div>
</div>

<script type="module">
// ================== CONFIGURACIÓN ==================

// ---------- Sesión ----------
$("btnLogin").onclick = async () => {
  const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });

  catch (e) {
    if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment"].includes(e.code)) signInWithRedirect(auth, p);

$("btnSalir").onclick = () => { if (confirm("¿Cerrar sesión?")) signOut(auth); };

onAuthStateChanged(auth, async (u) => {
  usuario = u; $("pCarga").classList.add("oculto");
  if (quitar) { quitar(); quitar = null; }
  if (!u) { $("app").classList.add("oculto"); $("pLogin").classList.remove("oculto"); return; }
  $("pLogin").classList.add("oculto"); $("app").classList.remove("oculto");
  $("correo").textContent = u.email || "";

// ---------- Fechas y orden ----------
const z = (n) => String(n).padStart(2, "0");
const local = (d) => `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`;
const hoy = () => local(new Date()).slice(0, 10);
const aDate = (f) => new Date(f.length === 10 ? f + "T23:59" : f);
function estado(f) {
  if (!f) return null;
  const d = aDate(f), dia = f.slice(0, 10), man = local(new Date(Date.now() + 864e5)).slice(0, 10);
  if (d < new Date()) return "vencida";
  if (dia === hoy()) return "hoy";
  if (dia === man) return "manana";
  return "despues";
}
function textoFecha(f) {
  if (!f) return "";
  const d = new Date(f.length === 10 ? f + "T00:00" : f), e = estado(f);
  const hora = f.length > 10 ? " " + d.toLocaleTimeString("es-MX", { hour: "numeric", minute: "2-digit" }) : "";
  if (e === "hoy") return "Hoy" + hora;
  if (e === "manana") return "Mañana" + hora;
  const dia = d.toLocaleDateString("es-MX", { weekday: "short", day: "numeric", month: "short" });
  return (e === "vencida" ? "Venció " : "") + dia + hora;
}
const peso = { alta: 0, media: 1, baja: 2 };
const porOrden = (a, b) => (a.orden ?? 0) - (b.orden ?? 0);
function urgencia(t) {
  const e = estado(t.fecha);
  return [{ vencida: 0, hoy: 0 }[e] ?? 1, peso[t.prioridad] ?? 1, { vencida: 0, hoy: 1, manana: 2, despues: 3 }[e] ?? 4, t.fecha || "9", t.orden ?? 0];
}
function porUrgencia(a, b) { const x = urgencia(a), y = urgencia(b); for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1; return 0; }
const pendientes = () => tareas.filter((t) => !t.hecha);
const deAhora = () => pendientes().filter((t) => ["vencida", "hoy"].includes(estado(t.fecha)) || t.prioridad === "alta").sort(porUrgencia);

// ---------- Pintar lista ----------
const CHECK = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>';
const BANDERA = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.6"><path d="M5 21V4h11l-2 4 2 4H5" /></svg>';
function fila(t) {
  const p = PRIOS.includes(t.prioridad) ? t.prioridad : "media", pasos = t.pasos || [], ok = pasos.filter((x) => x.hecho).length, e = estado(t.fecha);
  const meta = [];
  if (pasos.length) meta.push(`<span>${ok} de ${pasos.length}</span>`);
  if (t.fecha) meta.push(`<span class="${t.hecha ? "" : e === "vencida" ? "vencida" : e === "hoy" ? "hoy" : ""}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg>${esc(textoFecha(t.fecha))}</span>`);
  if (t.descripcion) meta.push(`<span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Nota</span>`);
  return `<div class="fila p-${p} ${t.hecha ? "hecha" : ""} ${t.id === abierta ? "sel" : ""}" data-id="${t.id}">
    <button class="circulo" data-check="${t.id}" aria-label="Completar">${CHECK}</button>
    <div class="txt"><div class="titulo">${esc(t.titulo)}</div>${meta.length ? `<div class="meta">${meta.join("")}</div>` : ""}</div>
    <button class="bandera" data-ciclo="${t.id}" title="Prioridad ${NOMBRE_P[p]} (toca para cambiar)">${BANDERA}</button></div>`;
}
const VISTAS = {
  ahora: ["Haz ahora", () => new Date().toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" })],
  prioridad: ["Por prioridad", () => "Arrastra para acomodar tus tareas"],
  planeado: ["Planeado", () => "Tareas con fecha"],

};
function pintar() {
  sortables.splice(0).forEach((s) => s.destroy());
  document.querySelectorAll(".item-menu[data-vista]").forEach((b) => b.classList.toggle("activo", b.dataset.vista === vista));

  $("titulo").textContent = VISTAS[vista][0];
  const sub = VISTAS[vista][1](); $("subtitulo").textContent = sub ? sub[0].toUpperCase() + sub.slice(1) : "";
  $("zonaAgregar").classList.toggle("oculto", vista === "completadas");
  const c = $("cuerpo");

  if (vista === "prioridad") {
    let html = "";
    for (const p of PRIOS) {
      const l = pend.filter((t) => (PRIOS.includes(t.prioridad) ? t.prioridad : "media") === p).sort(porOrden);
      html += `<div class="seccion p-${p}"><span class="punto"></span>${NOMBRE_P[p]} <em>${l.length || ""}</em></div>
        <div class="lista" data-prio="${p}">${l.map(fila).join("")}</div><div class="vacio-seccion">Arrastra aquí tareas de prioridad ${NOMBRE_P[p].toLowerCase()}</div>`;
    }
    const hechas = tareas.filter((t) => t.hecha).sort((a, b) => (b.hechaEn?.seconds || 0) - (a.hechaEn?.seconds || 0));
    if (hechas.length) html += `<div class="seccion plegable ${completadasPlegadas ? "plegado" : ""}" id="plegar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>Completadas <em>${hechas.length}</em></div>
      <div class="lista ${completadasPlegadas ? "oculto" : ""}">${hechas.slice(0, 30).map(fila).join("")}</div>`;
    c.innerHTML = html;
    $("plegar")?.addEventListener("click", () => { completadasPlegadas = !completadasPlegadas; pintar(); });
    if (window.Sortable) c.querySelectorAll(".lista[data-prio]").forEach((el) => sortables.push(new Sortable(el, {
      group: "prio", animation: 160, delay: 220, delayOnTouchOnly: true, filter: ".circulo,.bandera", preventOnFilter: false,
      ghostClass: "sortable-ghost", chosenClass: "sortable-chosen", onEnd: alSoltar

    return;
  }
  if (vista === "ahora") {
    const l = deAhora();
    if (!l.length) {
      const otra = pend.sort(porUrgencia)[0];
      c.innerHTML = otra ? `<div class="vacio"><img src="isotipo.png" alt=""><br>Nada urgente por ahora.</div><div class="seccion">Podrías avanzar con</div><div class="lista">${fila(otra)}</div>`

      return;
    }
    const p = l[0];
    c.innerHTML = `<div class="sugerencia" data-abrir="${p.id}"><img src="isotipo.png" alt=""><div><small>Empieza por aquí</small><b>${esc(p.titulo)}</b><span>${esc([textoFecha(p.fecha), "Prioridad " + NOMBRE_P[p.prioridad || "media"].toLowerCase()].filter(Boolean).join(" · "))}</span></div></div>
      <div class="lista">${l.map(fila).join("")}</div>`;
    return;
  }
  if (vista === "planeado") {
    const l = pend.filter((t) => t.fecha).sort((a, b) => aDate(a.fecha) - aDate(b.fecha));
    const g = [["Vencidas", "vencida"], ["Hoy", "hoy"], ["Mañana", "manana"], ["Más adelante", "despues"]];
    const html = g.map(([n, k]) => { const x = l.filter((t) => estado(t.fecha) === k); return x.length ? `<div class="seccion">${n} <em>${x.length}</em></div><div class="lista">${x.map(fila).join("")}</div>` : ""; }).join("");
    c.innerHTML = html || `<div class="vacio"><img src="isotipo.png" alt=""><br>No tienes tareas con fecha.</div>`;
    return;
  }
  const l = tareas.filter((t) => t.hecha).sort((a, b) => (b.hechaEn?.seconds || 0) - (a.hechaEn?.seconds || 0));
  c.innerHTML = l.length ? `<div class="lista">${l.map(fila).join("")}</div>` : `<div class="vacio"><img src="isotipo.png" alt=""><br>Aún no completas tareas.</div>`;
}

// Arrastrar: nuevo orden y, si cambió de sección, nueva prioridad
function alSoltar(ev) {
  const id = ev.item.dataset.id, prio = ev.to.dataset.prio;
  const ids = [...ev.to.children].map((n) => n.dataset.id);
  const i = ids.indexOf(id);
  const ordenDe = (x) => tareas.find((t) => t.id === x)?.orden ?? 0;
  const antes = i > 0 ? ordenDe(ids[i - 1]) : null, despues = i < ids.length - 1 ? ordenDe(ids[i + 1]) : null;
  const orden = antes === null && despues === null ? Date.now() : antes === null ? despues - 1000 : despues === null ? antes + 1000 : (antes + despues) / 2;
  const t = tareas.find((x) => x.id === id); if (t) { t.orden = orden; t.prioridad = prio; }
  guardar(id, { orden, prioridad: prio });
}

// Clics en la lista
$("cuerpo").addEventListener("click", (e) => {
  const ch = e.target.closest("[data-check]"); if (ch) { e.stopPropagation(); completar(ch.dataset.check); return; }
  const ci = e.target.closest("[data-ciclo]"); if (ci) { e.stopPropagation(); cicloPrio(ci.dataset.ciclo); return; }
  const f = e.target.closest("[data-id],[data-abrir]"); if (f) abrir(f.dataset.id || f.dataset.abrir);
});
async function completar(id) {
  const t = tareas.find((x) => x.id === id); if (!t) return;
  const v = !t.hecha;
  await guardar(id, { hecha: v, hechaEn: v ? serverTimestamp() : null });
  if (v) toast("✓ Tarea completada");
}

  const t = tareas.find((x) => x.id === id); if (!t) return;
  const sig = { alta: "media", media: "baja", baja: "alta" }[t.prioridad || "media"];
  guardar(id, { prioridad: sig }); toast("Prioridad: " + NOMBRE_P[sig]);
}

// ---------- Navegación ----------
document.querySelectorAll(".item-menu[data-vista]").forEach((b) => b.onclick = () => {
  vista = b.dataset.vista; try { localStorage.setItem("mw_vista", vista); } catch {}
  cerrarMenu(); pintar();
});
$("btnMenu").onclick = () => { $("lateral").classList.add("abierto"); $("velo").classList.add("ver"); };
$("velo").onclick = cerrarMenu;
function cerrarMenu() { $("lateral").classList.remove("abierto"); $("velo").classList.remove("ver"); }
function abrir(id) { if (location.hash !== "#t/" + id) location.hash = "t/" + id; else ruta(); }
function cerrarDetalle() { if (location.hash.startsWith("#t/")) history.length > 1 ? history.back() : (location.hash = ""); }
function ruta() {
  if (!usuario) return;
  const h = location.hash.slice(1);
  if (h.startsWith("t/") && tareas.length === 0) { setTimeout(ruta, 300); return; }
  abierta = h.startsWith("t/") ? h.slice(2) : null;
  if (abierta && !tareas.find((t) => t.id === abierta)) abierta = null;
  $("detalle").classList.toggle("oculto", !abierta);
  $("app").classList.toggle("con-detalle", !!abierta);
  if (abierta) pintarDetalle(true);
  pintar();
}
window.addEventListener("hashchange", ruta);
$("btnCerrarDet").onclick = cerrarDetalle;
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && abierta && !document.activeElement.matches("input,textarea")) cerrarDetalle(); });

// ---------- Crear a mano ----------
$("inNueva").addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;
  const titulo = e.target.value.trim(); if (!titulo) return;
  e.target.value = "";
  const prio = vista === "ahora" ? "alta" : "media";
  const r = await addDoc(collection(db, "users", usuario.uid, "tareas"), {
    titulo, descripcion: "", pasos: [], fecha: vista === "ahora" ? hoy() : null, prioridad: prio, hecha: false, orden: -Date.now(), creada: serverTimestamp()
  });
  toast("Tarea agregada · tócala para agregar detalles");
  if (window.matchMedia("(min-width:900px)").matches) abrir(r.id);
});

// ---------- Detalle ----------
function autoAlto(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
function pintarDetalle(todo) {
  const t = tareas.find((x) => x.id === abierta); if (!t) { cerrarDetalle(); return; }
  const p = PRIOS.includes(t.prioridad) ? t.prioridad : "media";
  const activo = document.activeElement;
  $("dTituloBox").className = "det-titulo p-" + p + (t.hecha ? " hecha" : "");

}

}
const pasosDe = () => (tareas.find((x) => x.id === abierta)?.pasos || []).map((s) => ({ ...s }));

$("inPaso").addEventListener("keydown", (e) => {

});

  const p = pasosDe(), i = +e.target.dataset.pt, v = e.target.value.trim();

  guardar(abierta, { pasos: p });
});
$("dPasos").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.dataset.pt) { e.preventDefault(); $("inPaso").focus(); } });
$("btnBorrar").onclick = async () => {
  if (!confirm("¿Eliminar esta tarea? No se puede deshacer.")) return;
  const id = abierta; cerrarDetalle(); await deleteDoc(ref(id)); toast("Tarea eliminada");
};

// ---------- Clave de Gemini ----------
let trasGuardarClave = null;
function pedirClave(despues) { trasGuardarClave = despues || null; $("inClave").value = ""; $("mClave").classList.remove("oculto"); setTimeout(() => $("inClave").focus(), 50); }
$("btnClave").onclick = () => { cerrarMenu(); pedirClave(); };

$("btnGuardarClave").onclick = async () => {
  const k = $("inClave").value.trim().replace(/^"|"$/g, "");
  if (k.length < 20) { toast("Esa clave se ve incompleta"); return; }
  await setDoc(doc(db, "users", usuario.uid), { geminiKey: k }, { merge: true });
  clave = k; $("mClave").classList.add("oculto"); toast("Clave guardada");
  if (trasGuardarClave) { const f = trasGuardarClave; trasGuardarClave = null; f(); }
};

// ---------- Voz + IA ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, escuchando = false, base = "";
$("mic").onclick = () => {
  if (!clave) { pedirClave(() => $("mic").click()); return; }
  if (escuchando) { rec.stop(); return; }
  $("dictadoVivo").classList.remove("oculto");
  if (!SR) { $("dictado").placeholder = "Escribe o usa el micrófono de tu teclado y toca “Crear con IA”"; $("dictado").focus(); return; }
  empezar();
};
function empezar() {
  rec = new SR(); rec.lang = "es-MX"; rec.continuous = true; rec.interimResults = true;
  base = $("dictado").value.trim() ? $("dictado").value.trim() + " " : "";
  rec.onstart = () => { escuchando = true; $("mic").classList.add("escuchando"); $("estadoVoz").textContent = "Te escucho… toca el lobo para terminar"; };
  rec.onresult = (e) => { let s = ""; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; $("dictado").value = base + s; };
  rec.onerror = (e) => { if (e.error === "not-allowed") toast("Permite el micrófono para dictar"); else if (!["no-speech", "aborted"].includes(e.error)) toast("Micrófono: " + e.error); };
  rec.onend = () => { escuchando = false; $("mic").classList.remove("escuchando"); $("estadoVoz").textContent = ""; if ($("dictado").value.trim()) crearIA(); };
  rec.start();
}
$("btnCancelarDict").onclick = () => { if (escuchando) { rec.onend = null; rec.abort(); escuchando = false; $("mic").classList.remove("escuchando"); } $("dictado").value = ""; $("dictadoVivo").classList.add("oculto"); $("estadoVoz").textContent = ""; };
$("btnCrearIA").onclick = () => { if (escuchando) rec.stop(); else crearIA(); };

async function gemini(texto) {
  const a = new Date();
  const prompt = `Organizas tareas de trabajo. Hoy es ${a.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}, ${a.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" })} (ISO: ${hoy()}).
Con lo que la persona dictó, crea UNA tarea. Responde SOLO JSON con:
"titulo": corto, empieza con verbo, máx. 60 caracteres;
"descripcion": 1 a 3 frases con el contexto útil (personas, cantidades, detalles), o "";
"pasos": lista de pasos concretos en orden (máx. 8), o [] si es de un solo paso;
"fecha": "AAAA-MM-DDTHH:MM" si dio hora, "AAAA-MM-DD" si solo dio día, o null; interpreta "mañana", "el lunes", etc. respecto a hoy;
"prioridad": "alta" si es urgente/importante o vence hoy-mañana, "baja" si no corre prisa, si no "media".
Corrige errores de dictado. Español.
Dictado: """${texto}"""`;
  let ult = null;
  for (const m of MODELOS) {
    for (let i = 0; i < 2; i++) {
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {
        method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": clave },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json", temperature: 0.3 } })
      });
      if (r.ok) { const j = await r.json(); const s = j.candidates?.[0]?.content?.parts?.map((p) => p.text || "").join("") || ""; return JSON.parse(s.replace(/^```json|```$/g, "").trim()); }
      const er = await r.json().catch(() => ({})); ult = { status: r.status, msg: er.error?.message || r.statusText };
      if ([400, 401, 403].includes(r.status)) throw ult;
      if (r.status === 404) break;
      await new Promise((ok) => setTimeout(ok, 1500));
    }
  }
  throw ult || { status: 0, msg: "Sin respuesta" };
}
async function crearIA() {
  const texto = $("dictado").value.trim(); if (!texto) return;
  $("btnCrearIA").disabled = true; $("mic").classList.add("pensando"); $("estadoVoz").textContent = "El lobo está organizando tu tarea…";
  try {
    const r = await gemini(texto);
    const t = {
      titulo: String(r.titulo || texto.slice(0, 60)), descripcion: String(r.descripcion || ""),
      pasos: (Array.isArray(r.pasos) ? r.pasos : []).filter(Boolean).slice(0, 12).map((x) => ({ texto: String(x), hecho: false })),
      fecha: typeof r.fecha === "string" && /^\d{4}-\d{2}-\d{2}/.test(r.fecha) ? r.fecha.slice(0, 16) : null,
      prioridad: PRIOS.includes(r.prioridad) ? r.prioridad : "media", hecha: false, original: texto, orden: -Date.now(), creada: serverTimestamp()
    };
    const nr = await addDoc(collection(db, "users", usuario.uid, "tareas"), t);
    $("dictado").value = ""; $("dictadoVivo").classList.add("oculto");
    toast("✓ Tarea creada: revisa y ajusta lo que quieras"); abrir(nr.id);
  } catch (e) {
    const s = e.status;
    toast([400, 401, 403].includes(s) ? "La clave de Gemini no funciona. Revísala en el menú." : s === 429 ? "Límite gratuito del momento. Espera un minuto." : s === 503 ? "Gemini está saturado. Intenta en un momento; tu texto sigue ahí." : "No se pudo crear: " + (e.msg || e.message || e), 4500);
  } finally { $("btnCrearIA").disabled = false; $("mic").classList.remove("pensando"); $("estadoVoz").textContent = ""; }
}

setInterval(() => { if (usuario) pintar(); }, 60000);
